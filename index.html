<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#161514;--raise:#1d1c1a;--field:#1f1e1c;--line:rgba(236,232,224,.09);--line2:rgba(236,232,224,.16);--text:#ebe8e2;--text2:#b5b1a9;--muted:#85827b;--faint:#5f5c57;--track:#2b2a27;--accent:#9aab9c;--r:12px;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-feature-settings:"tnum" 1;padding:var(--sat) var(--sar) 0 var(--sal);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.hdr{padding:14px 22px 4px;max-width:640px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;height:32px}
.appname{font-size:13px;font-weight:500;color:var(--muted)}
.refresh{font-size:13px;color:var(--muted);height:44px;padding:0 2px}
h1{margin:2px 0 0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.022em}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
main{flex:1;padding:4px 22px 28px;max-width:640px;width:100%;margin:0 auto}
.sec{padding:20px 0;border-top:.5px solid var(--line)}
.view>.sec:first-child{border-top:0;padding-top:10px}
h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--muted)}
.picker{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
.picker::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:0 15px;height:38px;border-radius:19px;color:var(--muted);font-size:14px;font-weight:500;border:.5px solid var(--line2)}
.pill.on{color:var(--text);border-color:var(--text2);background:var(--raise)}
.pill .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:var(--muted)}
.track{flex:1;height:3px;background:var(--track);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
ul.wu{margin:0;padding:0;list-style:none}
ul.wu li{padding:10px 0 10px 18px;position:relative;color:var(--text2);font-size:15px;border-top:.5px solid var(--line)}
ul.wu li:first-child{border-top:0;padding-top:2px}
ul.wu li:before{content:"";position:absolute;left:2px;top:19px;width:5px;height:5px;border-radius:50%;border:1px solid var(--muted)}
ul.wu li:first-child:before{top:11px}
.ex h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
.exhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sr{font-size:17px;color:var(--text);font-weight:500;white-space:nowrap}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0 6px;font-size:14px}
.meta dt{color:var(--muted)}.meta dd{margin:0;color:var(--text2)}
.meta dd.tg{color:var(--text)}
.note{font-size:13px;color:var(--muted);margin:6px 0 4px;line-height:1.5}
.sets{margin-top:8px}
.set{display:flex;align-items:center;gap:10px;min-height:56px;border-top:.5px solid var(--line)}
.chk{width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.chk span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;transition:.15s}
.chk.on span{background:var(--accent);border-color:var(--accent)}
.chk.on span:after{content:"";width:10px;height:5px;border-left:2px solid #161514;border-bottom:2px solid #161514;transform:rotate(-45deg) translate(1px,-1px)}
.slbl{font-size:14px;color:var(--muted);width:44px;flex:0 0 44px}
.set.done .slbl{color:var(--text2)}
.set .x{color:var(--faint);font-size:14px}
.set input{flex:1;min-width:0;text-align:center;height:44px;background:var(--field);border:.5px solid var(--line2);border-radius:var(--r);padding:0 12px;font-size:16px;outline:none;color:var(--text)}
.set input:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{display:block;width:100%;min-height:76px;resize:none;background:var(--field);border:.5px solid var(--line2);border-radius:var(--r);padding:12px 14px;font-size:16px;outline:none;color:var(--text)}
.btn{height:50px;padding:0 18px;border-radius:var(--r);background:var(--text);color:var(--bg);font-weight:600;font-size:16px;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--text2);border:.5px solid var(--line2);margin-top:10px}
.hint{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.5}
.card-s h2{margin:0;font-size:19px;font-weight:600}
.card-s .f{font-size:13px;color:var(--muted);margin:2px 0 10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:.5px solid var(--line);font-size:15px}
.row span:first-child{color:var(--text2)}.row span:last-child{color:var(--muted);white-space:nowrap}
.open{height:44px;color:var(--accent);font-size:15px;font-weight:500;margin-top:4px}
ol.rules{margin:0;padding-left:18px;color:var(--text2);font-size:14px}
ol.rules li{padding:5px 0}
.week{display:flex;align-items:center;justify-content:space-between}
.week .n{font-size:30px;font-weight:600;letter-spacing:-.02em}
.week .n small{font-size:15px;color:var(--muted);font-weight:400}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--faint)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.lg .d{font-size:13px;color:var(--muted)}
.lg h2{margin:2px 0 8px;font-size:18px;font-weight:600}
.lg .e{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:.5px solid var(--line);font-size:14px}
.lg .e span:first-child{color:var(--text2)}.lg .e span:last-child{color:var(--text);text-align:right}
.cn{margin-top:10px;font-size:14px;color:var(--text2);padding-left:12px;border-left:1.5px solid var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;border:.5px solid var(--accent);color:var(--accent);margin-left:6px;font-weight:500;vertical-align:2px}
.empty{color:var(--faint);font-size:14px;padding:8px 0}
.tabs{position:sticky;bottom:0;z-index:30;display:flex;width:100%;background:rgba(22,21,20,.94);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-top:.5px solid var(--line2);padding:0 var(--sar) var(--sab) var(--sal);margin-top:auto}
.tabs button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--faint);gap:3px;font-weight:500}
.tabs button.on{color:var(--text)}
.view{display:none}.view.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.err{color:var(--text2);font-size:14px;padding:20px 0}
/* Oura A: Readiness (deep green-teal glow) */
:root{--glow1:#2f6656;--glow2:#1b3a33;--glow3:#16231f;--status:#4fd0a2}
/* ===== Oura theme (shared by variants A and B). Needs oura-enhance.js before </body>. ===== */
:root{--bg:#111214;--raise:#1b1c1f;--field:rgba(255,255,255,.07);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);
--text:#f4f2ee;--text2:rgba(244,242,238,.80);--muted:rgba(244,242,238,.52);--faint:rgba(244,242,238,.32);--track:rgba(255,255,255,.13);
--accent:#f4f2ee;--coral:#dc8f7a;--barfill:#ece8e2;
--serif:ui-serif,"New York","Iowan Old Style",Georgia,"Crimson Pro","Source Serif 4",serif;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;

#prevDay{position:absolute;left:0;top:2px}#nextDay{position:absolute;right:0;top:2px}

.card,.sec{border-top:0;padding:24px 0}
h3{font-size:24px;font-weight:400;color:var(--text);letter-spacing:0;margin-bottom:16px}
textarea,.inp{background:var(--field);border:.5px solid var(--frost-bd);border-radius:16px;color:var(--text)}

.todaybtn{display:inline-flex;align-items:center;position:absolute;left:0;top:0;height:44px;padding:0 14px;border-radius:99px;background:var(--frost);border:.5px solid var(--frost-bd);color:var(--text);font-size:14px;font-weight:600}

<body>
<header class="hdr">
  <div class="topbar"><span class="appname">Workout<span class="sync" id="syncStatus"></span></span><button class="refresh" id="refresh">Refresh plan</button></div>
  <h1 id="title">Today</h1>
  <div class="sub" id="subtitle"></div>
</header>
<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-prog"></section>
  <section class="view" id="v-hist"></section>
</main>
<nav class="tabs">
  <button class="on" data-v="today"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 12h18M6 8v8M18 8v8M8.5 10v4M15.5 10v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Today</button>
  <button data-v="prog"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 7h14M5 12h14M5 17h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Program</button>
  <button data-v="hist"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 19V11M10 19V6M15 19v-5M20 19V9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>History</button>
</nav>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var plan = null, view = 'today';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pdate(k) { var a = String(k).slice(0, 10).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
  function nice(k, wd) { return pdate(k).toLocaleDateString('en-GB', wd === false ? { day: 'numeric', month: 'short' } : { weekday: 'short', day: 'numeric', month: 'short' }); }
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var tt; function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 2000); }

  function fetchPlan(manual) {
    return fetch('plan.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (p) { plan = p; save('workout.v1.plan', p); render(); if (manual) toast('Plan updated'); })
      .catch(function (e) { var c = load('workout.v1.plan', null); if (c) { plan = c; render(); toast('Offline: showing the saved plan'); } else $('v-today').innerHTML = '<div class="err">Couldn’t load plan.json (' + esc(e.message) + ').</div>'; });
  }
  function sessionById(id) { return (plan.sessions || []).filter(function (s) { return s.id === id; })[0]; }
  function pickedId() { return load('workout.v1.pick.' + today(), null) || plan.nextSessionId || (plan.sessions[0] && plan.sessions[0].id); }
  function stateKey(sid) { return 'workout.v1.' + today() + '.' + sid; }
  function getState(s) {
    var st = load(stateKey(s.id), null);
    if (!st) {
      st = { ex: {}, note: '' };
      // prefill from today's log entry in plan.json, if any
      (plan.log || []).forEach(function (lg) {
        if (lg.date !== today() || lg.sessionId !== s.id) return;
        (lg.entries || []).forEach(function (en) {
          s.exercises.forEach(function (ex, i) {
            if (ex.name.toLowerCase() === String(en.exercise).toLowerCase() || (ex.short || '').toLowerCase() === String(en.exercise).toLowerCase()) {
              st.ex[i] = (en.sets || []).map(function (v) { return { d: true, v: v }; });
            }
          });
        });
      });
    }
    s.exercises.forEach(function (ex, i) { var a = st.ex[i] || []; for (var j = 0; j < (ex.sets || 0); j++) a[j] = mig(a[j] || { d: false }); st.ex[i] = a; });
    return st;
  }
  function putState(s, st) { if (!st.started) st.started = Date.now(); save(stateKey(s.id), st); queueSync(today(), s.id); }

  // ---------- Google Sheet sync ----------
  // Apps Script web-app URL. Keep EMPTY: this repo is public. The real URL + key live only in this phone's
  // localStorage, set in Program > Google Sheet sync or by a one-tap setup link: …/workout/#sync=<url>&key=<key>
  var SYNC_URL = '';
  var SK = { cfg: 'workout.v1.sync', q: 'workout.v1.syncq', st: 'workout.v1.synced' };
  var syncCfg = load(SK.cfg, {}), syncTimer = null, syncing = false, syncState = load(SK.st, { t: 0, err: false });
  function syncKey() { return String(syncCfg.key || '').trim(); }
  function syncUrl() { return syncKey() ? String(syncCfg.url || SYNC_URL || '').trim() : ''; }
  function parseSetup(text) {
    var t = String(text || '').trim(), i = t.indexOf('#');
    if (i >= 0 && /(^|[#&])sync=/.test(t.slice(i))) {
      var p = {}; t.slice(i + 1).split('&').forEach(function (kv) { var j = kv.indexOf('='); if (j > 0) { try { p[kv.slice(0, j)] = decodeURIComponent(kv.slice(j + 1)); } catch (e) {} } });
      return { url: String(p.sync || '').trim(), key: String(p.key || '').trim() };
    }
    return { url: t, key: '' };
  }
  function hm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function stamp(ms) { if (!ms) return ''; var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm(ms); }
  function queueSync(date, sid) {
    if (!syncUrl()) return;
    var k = date + '|' + sid, q = load(SK.q, []); if (q.indexOf(k) < 0) q.push(k); save(SK.q, q);
    clearTimeout(syncTimer); syncTimer = setTimeout(flushSync, 1500); renderSync();
  }
  function snapshot(k) {
    var a = k.split('|'), date = a[0], s = plan && sessionById(a[1]), st = load('workout.v1.' + date + '.' + a[1], null);
    if (!s || !st) return null;
    var sets = [], last = st.started || 0;
    s.exercises.forEach(function (ex, i) {
      (st.ex[i] || []).forEach(function (x, j) {
        if (x.t && x.t > last) last = x.t;
        sets.push({ exercise: ex.name, set: j + 1, kg: String(x.w || ''), reps: String(x.r || ''), done: !!x.d, time: x.t ? hm(x.t) : '' });
      });
    });
    return { date: date, sessionId: s.id, sessionName: s.name, started: stamp(st.started), updated: stamp(st.u || last || Date.now()), note: String(st.note || ''), sets: sets };
  }
  function flushSync() {
    var url = syncUrl(), q = load(SK.q, []);
    if (!url || !q.length || syncing || !plan) { renderSync(); return; }
    if (navigator.onLine === false || typeof fetch !== 'function') { syncState.err = true; renderSync(); return; }
    var snaps = q.map(snapshot).filter(Boolean);
    if (!snaps.length) { save(SK.q, []); renderSync(); return; }
    syncing = true; renderSync();
    var payload = snaps.length === 1 ? Object.assign({ app: 'workout', v: 1, key: syncKey() }, snaps[0]) : { app: 'workout', v: 1, key: syncKey(), sessions: snaps };
    // text/plain + no-cors = a "simple" request (no preflight); the response is opaque.
    fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function () {
        save(SK.q, load(SK.q, []).filter(function (k) { return q.indexOf(k) < 0; })); // keep sessions changed mid-flight
        syncState = { t: Date.now(), err: false }; save(SK.st, syncState);
      }, function () { syncState.err = true; save(SK.st, syncState); })
      .then(function () { syncing = false; renderSync(); if (load(SK.q, []).length && !syncState.err) { clearTimeout(syncTimer); syncTimer = setTimeout(flushSync, 1500); } });
  }
  function retrySync() { if (load(SK.q, []).length) { syncState.err = false; flushSync(); } }
  function syncText() {
    if (!syncUrl()) return syncCfg.url ? 'Sync needs the key' : '';
    if (syncState.err) return 'Offline, will retry';
    if (syncing || load(SK.q, []).length) return 'Syncing…';
    return syncState.t ? 'Synced ' + hm(syncState.t) : 'Sync on';
  }
  function renderSync() {
    var t = syncText(), el = $('syncStatus'); if (el) { el.textContent = t; el.classList.toggle('err', !!syncState.err && !!syncUrl()); }
    var s2 = $('syncStatus2'); if (s2) s2.textContent = t || 'Sync is off.';
  }
  function saveSyncCfg(url, key) {
    syncCfg = url ? { url: url, key: key } : {}; save(SK.cfg, syncCfg); syncState = { t: 0, err: false }; save(SK.st, syncState);
    if (url && plan) { var s = sessionById(pickedId()); if (s && load(stateKey(s.id), null)) queueSync(today(), s.id); }
    renderSync();
  }
  // one-tap setup link: #sync=<url>&key=<key>. The hash never reaches the server; clear it right away.
  (function () {
    if (!/(^#|&)sync=/.test(location.hash || '')) return;
    var ps = parseSetup(location.href);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (!/^https:\/\//.test(ps.url) || !ps.key) { setTimeout(function () { toast('Setup link incomplete'); }, 300); return; }
    syncCfg = { url: ps.url, key: ps.key }; save(SK.cfg, syncCfg); syncState = { t: 0, err: false }; save(SK.st, syncState);
    setTimeout(function () { toast('Google Sheet sync is set up'); }, 300);
  })();
  window.addEventListener('online', retrySync);
  // migrate old single-box values like '65×6' / '65x' / '65' into separate kg + reps
  function mig(x) {
    if (x.w === undefined && x.r === undefined) {
      var m = /^\s*(?:bw\s*)?(\+?[\d.,]+)?\s*(?:kg)?\s*[×xX*]?\s*(\d+)?\s*$/i.exec(String(x.v || ''));
      x.w = m && m[1] ? m[1].replace(',', '.') : ''; x.r = m && m[2] ? m[2] : '';
    }
    delete x.v; return x;
  }
  function targetKg(ex) { var m = /(\d+(?:\.\d+)?)\s*kg/i.exec(ex.target || ''); return m ? m[1] : ''; }
  function defaultKg(st, ex, i, j) { for (var k = j - 1; k >= 0; k--) { if (st.ex[i][k].w) return st.ex[i][k].w; } return targetKg(ex); }
  function fmtSet(x) { var w = String(x.w || '').trim(), r = String(x.r || '').trim(); if (r) return (w || 'BW') + '×' + r; if (w) return w + (x.d ? '×?' : ''); return x.d ? '✓' : ''; }
  function normVal(v) { return String(v || '').trim().replace(/\s*[xX*]\s*/g, '×').replace(/\s*×\s*/g, '×'); }

  function renderToday() {
    var s = sessionById(pickedId()); if (!s) { $('v-today').innerHTML = '<div class="err">No session found.</div>'; return; }
    var st = getState(s), total = 0, done = 0;
    s.exercises.forEach(function (ex, i) { st.ex[i].forEach(function (x) { total++; if (x.d) done++; }); });
    $('title').textContent = s.name.replace(/^Day \d+\s*·\s*/, '');
    $('subtitle').textContent = (s.name.match(/^Day \d+/) || [''])[0] + (s.id === plan.nextSessionId ? ' · next up' : '') + ' · ' + nice(today());
    var h = '<div class="sec"><div class="picker">' + plan.sessions.map(function (x) {
      return '<button class="pill' + (x.id === s.id ? ' on' : '') + '" data-pick="' + esc(x.id) + '">' + esc((x.name.match(/^Day \d+/) || [x.name])[0]) + (x.id === plan.nextSessionId ? '<span class="dot"></span>' : '') + '</button>';
    }).join('') + '</div>';
    h += '<div class="sub" style="margin-top:10px">' + esc(s.focus || '') + '</div>';
    h += '<div class="prog"><div class="track"><div class="fill" style="width:' + (total ? done / total * 100 : 0).toFixed(1) + '%"></div></div><span>' + done + ' / ' + total + ' sets</span></div></div>';
    if (s.warmup && s.warmup.length) h += '<div class="sec"><h3>Warm-up</h3><ul class="wu">' + s.warmup.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';
    s.exercises.forEach(function (ex, i) {
      h += '<div class="sec ex"><div class="exhd"><h2>' + esc(ex.name) + '</h2><span class="sr">' + esc(ex.sets) + ' × ' + esc(ex.reps) + '</span></div><dl class="meta">';
      if (ex.target) h += '<dt>Target</dt><dd class="tg">' + esc(ex.target) + '</dd>';
      if (ex.rest) h += '<dt>Rest</dt><dd>' + esc(ex.rest) + '</dd>';
      if (ex.lastTime) h += '<dt>Last time</dt><dd>' + esc(ex.lastTime) + '</dd>';
      h += '</dl>' + (ex.notes ? '<div class="note">' + esc(ex.notes) + '</div>' : '') + '<div class="sets">';
      st.ex[i].forEach(function (x, j) {
        h += '<div class="set' + (x.d ? ' done' : '') + '"><button class="chk' + (x.d ? ' on' : '') + '" data-ck="' + i + ':' + j + '" aria-label="Set ' + (j + 1) + ' done"><span></span></button><span class="slbl">Set ' + (j + 1) + '</span>' +
          '<input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="BW" aria-label="kg" data-kg="' + i + ':' + j + '" value="' + esc(x.w || defaultKg(st, ex, i, j)) + '"><span class="x">kg ×</span>' +
          '<input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="reps" aria-label="reps" data-rp="' + i + ':' + j + '" value="' + esc(x.r || '') + '"></div>';
      });
      h += '</div></div>';
    });
    h += '<div class="sec"><h3>Note for your coach (optional)</h3><textarea id="snote" placeholder="e.g. bench felt easy, left shoulder fine">' + esc(st.note || '') + '</textarea>' +
      '<div style="margin-top:12px"><button class="btn" id="copy">Copy summary</button><button class="btn ghost" id="reset">Clear today’s ticks</button></div><div class="hint">Weight carries over from the previous set, so usually just type reps; that ticks the set. Empty kg = bodyweight (BW). Ticks save on this phone for today. Paste the summary into chat.</div></div>';
    $('v-today').innerHTML = h;
  }
  function summary() {
    var s = sessionById(pickedId()), st = getState(s), parts = [];
    s.exercises.forEach(function (ex, i) {
      var v = st.ex[i].map(fmtSet).filter(Boolean);
      if (v.length) parts.push((ex.short || ex.name) + ' ' + v.join(', '));
    });
    var txt = s.name + ', ' + nice(today()) + '\n' + (parts.length ? parts.join('; ') : 'No sets logged yet');
    if (st.note && st.note.trim()) txt += '\nNote: ' + st.note.trim();
    return txt;
  }
  function copyText(t) {
    function fallback() { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? 'Summary copied' : 'Copy failed. Long-press to select instead.'); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(function () { toast('Summary copied, paste it into chat'); }, fallback); else fallback();
  }
  function updateProg(s, st) {
    var total = 0, done = 0; s.exercises.forEach(function (ex, i) { st.ex[i].forEach(function (x) { total++; if (x.d) done++; }); });
    var f = document.querySelector('#v-today .fill'); if (f) f.style.width = (total ? done / total * 100 : 0).toFixed(1) + '%';
    var sp = document.querySelector('#v-today .prog span'); if (sp) sp.textContent = done + ' / ' + total + ' sets';
  }
  function renderProgram() {
    var h = '';
    plan.sessions.forEach(function (s) {
      h += '<div class="sec card-s"><h2>' + esc(s.name) + (s.id === plan.nextSessionId ? '<span class="tag">next</span>' : '') + '</h2><div class="f">' + esc(s.focus || '') + '</div>';
      s.exercises.forEach(function (ex) { h += '<div class="row"><span>' + esc(ex.name) + '</span><span>' + esc(ex.sets) + ' × ' + esc(ex.reps) + '</span></div>'; });
      h += '<button class="open" data-open="' + esc(s.id) + '">Open in Today</button></div>';
    });
    if (plan.notes && plan.notes.length) h += '<div class="sec"><h3>Rules</h3><ol class="rules">' + plan.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ol></div>';
    h += '<div class="sec syncsec"><h3>Google Sheet sync</h3>' +
      '<input class="inp" id="syncUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Setup link or …/exec URL" value="' + esc(syncCfg.url || '') + '">' +
      '<input class="inp" id="syncKey" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Sync key" value="' + esc(syncCfg.key || '') + '">' +
      '<div class="btns"><button class="btn" id="saveSync">Save</button><button class="btn ghost" id="syncNow">Sync now</button></div>' +
      '<div class="hint"><span id="syncStatus2"></span> Paste the setup link from your coach into the first box (it fills both). Every tick or edit sends today’s session to the sheet about 1.5 s later, so your coach can follow live. Clear the URL to turn sync off. Stored only on this phone.</div></div>';
    if (plan.updated) h += '<div class="hint">Plan updated ' + esc(new Date(plan.updated).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</div>';
    $('v-prog').innerHTML = h; renderSync();
  }
  function renderHistory() {
    var w = plan.weekly || { goal: 4, done: 0 }, h = '<div class="sec"><h3>This week' + (w.weekOf ? ' · from ' + esc(nice(w.weekOf, false)) : '') + '</h3><div class="week"><div class="n">' + esc(w.done) + ' <small>of ' + esc(w.goal) + ' sessions</small></div><div class="dots">';
    for (var i = 0; i < (w.goal || 4); i++) h += '<i class="' + (i < w.done ? 'on' : '') + '"></i>';
    h += '</div></div>';
    if (plan.wedding) { var days = Math.ceil((pdate(plan.wedding) - pdate(today())) / 864e5); if (days >= 0) h += '<div class="hint">' + days + ' days to the wedding</div>'; }
    h += '</div>';
    var log = (plan.log || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    if (!log.length) h += '<div class="sec empty">No sessions logged yet.</div>';
    log.forEach(function (lg) {
      var s = sessionById(lg.sessionId);
      h += '<div class="sec lg"><div class="d">' + esc(nice(lg.date)) + '</div><h2>' + esc(s ? s.name : lg.sessionId) + (lg.inProgress ? '<span class="tag">in progress</span>' : '') + '</h2>';
      (lg.entries || []).forEach(function (en) { h += '<div class="e"><span>' + esc(en.exercise) + '</span><span>' + esc((en.sets || []).join(', ')) + '</span></div>'; });
      if (lg.coachNote) h += '<div class="cn">' + esc(lg.coachNote) + '</div>';
      h += '</div>';
    });
    $('v-hist').innerHTML = h;
  }
  function render() {
    if (!plan) return;
    if (view === 'today') renderToday();
    else { $('title').textContent = view === 'prog' ? 'Program' : 'History'; $('subtitle').textContent = view === 'prog' ? '4-day upper / lower split' : 'Sessions and coach notes'; if (view === 'prog') renderProgram(); else renderHistory(); }
  }
  // events
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-v]'); if (!b) return; view = b.getAttribute('data-v');
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) { x.classList.toggle('on', x === b); });
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) { v.classList.toggle('on', v.id === 'v-' + view); });
    render(); window.scrollTo(0, 0);
  });
  $('refresh').addEventListener('click', function () { fetchPlan(true); });
  $('v-today').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var s = sessionById(pickedId());
    if (b.hasAttribute('data-ck')) {
      var ij = b.getAttribute('data-ck').split(':').map(Number), st = getState(s), x = st.ex[ij[0]][ij[1]];
      var kg = document.querySelector('[data-kg="' + ij[0] + ':' + ij[1] + '"]'), rp = document.querySelector('[data-rp="' + ij[0] + ':' + ij[1] + '"]');
      if (kg) x.w = kg.value.trim().replace(',', '.'); if (rp) x.r = rp.value.replace(/\D/g, '');
      x.d = !x.d; x.t = Date.now(); st.u = x.t; putState(s, st); var y = window.scrollY; renderToday(); window.scrollTo(0, y);
    } else if (b.hasAttribute('data-pick')) { save('workout.v1.pick.' + today(), b.getAttribute('data-pick')); renderToday(); }
    else if (b.id === 'copy') copyText(summary());
    else if (b.id === 'reset') { if (confirm('Clear all ticks and numbers for this session today?')) { var st2 = { ex: {}, note: '' }; s.exercises.forEach(function (ex, i) { st2.ex[i] = []; for (var j = 0; j < ex.sets; j++) st2.ex[i].push({ d: false, w: '', r: '' }); }); putState(s, st2); renderToday(); } }
  });
  $('v-today').addEventListener('change', function (e) {
    var t = e.target, s = sessionById(pickedId()), st = getState(s);
    if (t.hasAttribute('data-kg') || t.hasAttribute('data-rp')) {
      var key = t.getAttribute('data-kg') || t.getAttribute('data-rp'), ij = key.split(':').map(Number), x = st.ex[ij[0]][ij[1]];
      var kg = document.querySelector('[data-kg="' + key + '"]'), rp = document.querySelector('[data-rp="' + key + '"]');
      x.w = kg.value.trim().replace(',', '.'); x.r = rp.value.replace(/\D/g, ''); rp.value = x.r;
      if (x.r && !x.d) x.d = true;
      x.t = Date.now(); st.u = x.t; putState(s, st);
      // reflect tick + carry the weight forward into later, still-empty sets
      var row = t.closest('.set'); row.classList.toggle('done', x.d); row.querySelector('.chk').classList.toggle('on', x.d);
      for (var k = ij[1] + 1; k < st.ex[ij[0]].length; k++) { if (st.ex[ij[0]][k].w) break; var nk = document.querySelector('[data-kg="' + ij[0] + ':' + k + '"]'); if (nk && x.w) nk.value = x.w; }
      updateProg(s, st);
    } else if (t.id === 'snote') { st.note = t.value; st.u = Date.now(); putState(s, st); }
  });
  $('v-prog').addEventListener('click', function (e) {
    if (e.target.closest('#saveSync')) {
      var ps = parseSetup($('syncUrl').value), url = ps.url, key = ps.key || $('syncKey').value.trim();
      if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url) && !confirm('That doesn’t look like an Apps Script URL. Save anyway?')) return;
      if (url && !key) { toast('Add the sync key too'); return; }
      $('syncUrl').value = url; $('syncKey').value = url ? key : ''; saveSyncCfg(url, key); toast(url ? 'Sync saved' : 'Sync off'); return;
    }
    if (e.target.closest('#syncNow')) {
      if (!syncUrl()) { toast('Set the sync link first'); return; }
      var s0 = plan && sessionById(pickedId()); if (s0 && load(stateKey(s0.id), null)) queueSync(today(), s0.id);
      syncState.err = false; flushSync(); return;
    }
    var b = e.target.closest('[data-open]'); if (!b) return; save('workout.v1.pick.' + today(), b.getAttribute('data-open')); document.querySelector('[data-v="today"]').click(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { fetchPlan(false); retrySync(); } });
  window.__w = { summary: function () { return summary(); }, snapshot: snapshot, flush: flushSync };
  renderSync();
  fetchPlan(false).then(function () { if (syncUrl() && load(SK.q, []).length) setTimeout(flushSync, 1000); }); // retry anything queued last time
})();
</script>
<script>
/* Oura theme enhancer: works for both apps. Reads only what the app already rendered and adds
   presentational elements (status word, serif headline, per-row "behind" state, per-exercise bars).
   No app state is touched. Include right before </body>. */
(function () {
  'use strict';
  var busy = false;
  function num(s) { return parseFloat(String(s || '').replace(/[^0-9.]/g, '')) || 0; }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function meal() {
    var ring = document.getElementById('ring'), bars = document.getElementById('bars');
    if (!ring || !bars) return;
    var big = ring.querySelector('.big'), sm = ring.querySelector('.sm'), sm2 = ring.querySelector('.sm2');
    if (!big) return;
    var val = num(big.textContent), tgt = num(sm && sm.textContent) || 1, pct = val / tgt;
    // hero status word beside the number
    if (!ring.querySelector('.th-status')) {
      var st = pct > 1.1 ? ['OVER', 'warn'] : pct >= 0.9 ? ['OPTIMAL', 'ok'] : pct >= 0.45 ? ['GOOD', 'ok'] : pct > 0 ? ['BEHIND', 'warn'] : ['START', 'ok'];
      var unit = el('span', 'th-unit', 'kcal'), s = el('span', 'th-status ' + st[1], st[0]);
      big.appendChild(unit); big.appendChild(s);
    }
    // serif coach headline above the nudge paragraph
    var nb = document.getElementById('nudgeBox'), h = document.getElementById('thHeadline');
    if (nb) {
      if (!h) { h = el('h2', 'th-headline'); h.id = 'thHeadline'; nb.parentNode.insertBefore(h, nb); }
      var left = Math.round((tgt - val) / 10) * 10;
      var txt = val === 0 ? 'A fresh start' : left > 0 ? 'You\u2019re ' + left.toLocaleString('en-GB') + ' kcal short' : left > -150 ? 'Right on target' : 'You\u2019re ' + (-left).toLocaleString('en-GB') + ' kcal over';
      if (h.textContent !== txt) h.textContent = txt;
    }
    // contributor rows: coral when a macro lags the calorie pace
    [].forEach.call(bars.querySelectorAll('.bar'), function (b) {
      var sp = b.querySelector('.lbl span'); if (!sp) return;
      var a = sp.textContent.split('/'), p = num(a[0]) / (num(a[1]) || 1);
      b.classList.toggle('behind', pct > 0.15 && p < pct * 0.8);
    });
  }

  function workout() {
    var v = document.getElementById('v-today'); if (!v || !v.firstElementChild || v.querySelector('.th-hero')) return;
    var title = document.getElementById('title'), sub = document.getElementById('subtitle');
    var first = v.querySelector('.sec'), prog = first && first.querySelector('.prog');
    if (!prog) return;
    var m = (prog.querySelector('span') || {}).textContent || '', a = m.split('/'), done = num(a[0]), total = num(a[1]);
    var st = done === 0 ? ['READY', 'ok'] : done >= total ? ['COMPLETE', 'ok'] : ['IN PROGRESS', 'ok'];
    var hero = el('div', 'th-hero');
    var n = el('div', 'th-num'); n.appendChild(document.createTextNode(done)); n.appendChild(el('span', 'th-unit', '/ ' + total + ' sets')); n.appendChild(el('span', 'th-status ' + st[1], st[0]));
    hero.appendChild(n);
    hero.appendChild(el('h2', 'th-headline', title ? title.textContent : ''));
    var focus = first.querySelector('.sub'); if (focus) { focus.classList.add('th-lede'); }
    var picker = first.querySelector('.picker');
    first.insertBefore(hero, picker ? picker.nextSibling : first.firstChild);
    if (focus) hero.appendChild(focus);
    // per-exercise contributor bar under each exercise row
    [].forEach.call(v.querySelectorAll('.sec.ex'), function (ex) {
      var sets = ex.querySelectorAll('.set'), d = ex.querySelectorAll('.set.done').length;
      var hd = ex.querySelector('.exhd'); if (!hd) return;
      var tr = el('div', 'th-track'), f = el('div', 'th-fill'); f.style.width = (sets.length ? d / sets.length * 100 : 0) + '%'; tr.appendChild(f);
      hd.parentNode.insertBefore(tr, hd.nextSibling);
      if (d) ex.classList.add('th-started');
    });
  }

  function run() { if (busy) return; busy = true; try { meal(); workout(); } catch (e) {} busy = false; }
  new MutationObserver(function () { run(); }).observe(document.body, { childList: true, subtree: true });
  if (document.readyState !== 'loading') run(); else document.addEventListener('DOMContentLoaded', run);
})();
</script>
